<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Labs</title>
<link rel="stylesheet" href="../katex/katex.min.css">
<style>
  :root { --bg: #0f1419; --panel: #151c24; --card: #111820; --ink: #e2e8f0; --muted: #94a3b8; --line: #2b3643;
          --accent: #67e8f9; --gold: #fbbf24; --good: #4ade80; --bad: #f87171;
          --serif: "Noto Serif TC", "Source Han Serif TC", Georgia, serif; }
  * { box-sizing: border-box; }
  body { margin: 0; background: var(--bg); color: var(--ink); font: 15px/1.6 "Noto Sans TC", "Microsoft JhengHei", system-ui, sans-serif; }
  a { color: var(--accent); }
  .top { position: sticky; top: 0; z-index: 20; display: flex; align-items: center; gap: 16px; padding: 10px 20px;
         background: #0c1116; border-bottom: 1px solid var(--line); }
  .top .brand { font: 700 16px var(--serif); }
  .top .back { margin-left: auto; font-size: 14px; text-decoration: none; }
  .layout { display: grid; grid-template-columns: 250px minmax(0, 1fr); min-height: calc(100vh - 49px); }
  #lab-list { border-right: 1px solid var(--line); padding: 14px 10px; background: #0c1116; }
  #lab-list button { display: block; width: 100%; text-align: left; background: none; border: 1px solid transparent; color: var(--muted);
                     border-radius: 8px; padding: 9px 10px; margin-bottom: 4px; cursor: pointer; font: inherit; }
  #lab-list button:hover { color: var(--ink); border-color: var(--line); }
  #lab-list button.on { background: #13232c; color: var(--ink); border-color: #155e75; }
  #lab-list .src { display: block; font-size: 12px; color: #64748b; margin-top: 2px; }
  main { padding: 22px 28px 80px; max-width: 1400px; }
  h1 { font: 700 26px/1.3 var(--serif); margin: 0 0 6px; }
  .question { color: #cbd5e1; margin: 0 0 10px; max-width: 60em; }
  .chips { display: flex; flex-wrap: wrap; gap: 6px; margin-bottom: 18px; }
  .chip { border: 1px solid var(--line); border-radius: 999px; padding: 0 10px; font-size: 12px; line-height: 1.9; color: var(--muted); text-decoration: none; }
  a.chip { color: var(--accent); border-color: #155e75; }
  .work { display: grid; grid-template-columns: 300px minmax(0, 1fr); gap: 18px; align-items: start; }
  .panel { position: sticky; top: 64px; background: var(--card); border: 1px solid var(--line); border-radius: 12px; padding: 14px 16px; }
  .panel h2 { font-size: 13px; letter-spacing: .08em; text-transform: uppercase; color: var(--muted); margin: 0 0 10px; }
  .ctl { margin-bottom: 14px; }
  .ctl .row { display: flex; justify-content: space-between; align-items: baseline; gap: 8px; }
  .ctl label { font-weight: 600; font-size: 14px; }
  .ctl .v { font: 12px/1.8 ui-monospace, Consolas, monospace; color: var(--accent); background: #1e293b; border-radius: 4px; padding: 0 7px; }
  .ctl .help { color: var(--muted); font-size: 12px; margin-top: 2px; }
  .ctl input[type=range] { width: 100%; accent-color: var(--accent); }
  .ctl select { width: 100%; background: #1e293b; color: var(--ink); border: 1px solid #475569; border-radius: 6px; padding: 5px 8px; font: inherit; }
  .ctl input[type=checkbox] { accent-color: var(--accent); width: 16px; height: 16px; }
  .actions { display: flex; gap: 8px; margin-top: 6px; }
  .actions button { flex: 1; font: inherit; font-size: 13px; padding: 6px 8px; border-radius: 6px; border: 1px solid #475569; background: #1e293b; color: var(--ink); cursor: pointer; }
  .actions button:hover { border-color: var(--accent); }
  .status { margin-top: 12px; font-size: 13px; color: var(--muted); display: flex; align-items: center; gap: 8px; min-height: 20px; }
  .dot { width: 8px; height: 8px; border-radius: 50%; background: var(--good); flex: none; }
  .status.busy .dot { background: var(--gold); animation: pulse 1s infinite; }
  .status.err .dot { background: var(--bad); }
  @keyframes pulse { 50% { opacity: .3; } }
  .results { min-width: 0; transition: opacity .15s; }
  .results.busy { opacity: .45; pointer-events: none; }
  .summary { font-size: 17px; line-height: 1.6; background: #0e2530; border: 1px solid #155e75; border-left: 4px solid var(--accent);
             border-radius: 8px; padding: 12px 16px; margin: 0 0 16px; }
  .card { background: var(--card); border: 1px solid var(--line); border-radius: 12px; padding: 14px 16px; margin-bottom: 16px; }
  .card h3 { margin: 0 0 8px; font-size: 15px; }
  .methods { display: grid; grid-template-columns: repeat(auto-fit, minmax(340px, 1fr)); gap: 16px; margin-bottom: 16px; }
  .method { margin: 0; }
  .method .head { display: flex; align-items: center; gap: 8px; margin-bottom: 6px; }
  .kind { font-size: 11px; letter-spacing: .06em; text-transform: uppercase; border-radius: 4px; padding: 1px 7px; border: 1px solid; }
  .kind.traditional { color: var(--gold); border-color: #854d0e; }
  .kind.paper { color: var(--accent); border-color: #155e75; }
  .metric { display: flex; align-items: baseline; gap: 8px; margin: 2px 0 8px; }
  .metric b { font: 700 30px/1.1 ui-monospace, Consolas, monospace; }
  .metric span { color: var(--muted); font-size: 13px; }
  .method.win { border-color: #166534; box-shadow: 0 0 0 1px #166534 inset; }
  .method.win .metric b { color: var(--good); }
  .win-tag { margin-left: auto; font-size: 12px; color: var(--good); }
  .failures { display: flex; flex-wrap: wrap; gap: 8px; }
  .failures button { font: inherit; font-size: 13px; text-align: left; background: #1a1414; border: 1px solid #7f1d1d; color: #fecaca;
                     border-radius: 8px; padding: 6px 10px; cursor: pointer; }
  .failures button small { display: block; color: #fca5a5; opacity: .8; }
  .prov { font-size: 13px; color: var(--muted); }
  .prov div { margin: 3px 0; }
  .prov .live::before { content: "●"; color: var(--good); margin-right: 6px; }
  .prov .cache::before { content: "◆"; color: var(--gold); margin-right: 6px; }
  .note { color: var(--muted); font-size: 13px; }
  .error { border-color: #7f1d1d; background: #1a1010; }
  .error pre { white-space: pre-wrap; font-size: 12px; color: #fca5a5; }
  .empty { color: var(--muted); padding: 40px 0; }
  .empty code { background: #1e293b; padding: 2px 8px; border-radius: 4px; color: var(--ink); }
  table { border-collapse: collapse; width: 100%; font-size: 14px; }
  th, td { border-bottom: 1px solid var(--line); padding: 6px 8px; text-align: left; }
  th { color: var(--muted); font-weight: 600; }
  .input-img { max-width: 100%; background: #fff; border-radius: 6px; padding: 8px; cursor: zoom-in; }
  @media (max-width: 1000px) { .layout { grid-template-columns: 1fr; } #lab-list { display: flex; overflow-x: auto; gap: 6px; border-right: 0; border-bottom: 1px solid var(--line); }
                               #lab-list button { flex: none; width: auto; margin: 0; } .work { grid-template-columns: 1fr; } .panel { position: static; } main { padding: 16px; } }
</style>
</head>
<body>
<div class="top">
  <span class="brand" id="brand">Labs</span>
  <span class="chip">computed by the Python backend on request</span>
  <a class="back" href="../index.html">← Reading page</a>
</div>
<div class="layout">
  <nav id="lab-list" aria-label="Labs"></nav>
  <main id="lab"><p class="empty">Loading labs…</p></main>
</div>
<script src="../katex/katex.min.js"></script>
<script src="../widgets.js"></script>
<script src="lab.js"></script>
</body>
</html>
